# next-article-share-app の外部 E2E をステージングに向けて流す。
#
# 今は手動実行（workflow_dispatch）のみ。アプリ側のデプロイ後に自動で起動する
# repository_dispatch は次の段階で足す（poc/next-article-share-app/poc-plan.md の「進め方」5）。
# 本番（@smoke のみ）は、本番 URL と固定テストアカウントの扱いが決まってから足す。
name: E2E next-article-share-app

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'テスト名で絞り込む（playwright test -g に渡す。空なら全テスト）'
        required: false
        default: ''

permissions:
  contents: read

# ステージングの DB は共有なので、書き込み系テストを同時に複数走らせない
concurrency:
  group: e2e-next-article-share-app-stg
  cancel-in-progress: false

jobs:
  stg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e/playwright-next-article-share-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/playwright-next-article-share-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Static check
        run: ./scripts/check.sh

      - name: Run E2E against staging
        env:
          GREP: ${{ inputs.grep }}
        run: |
          if [[ -n "$GREP" ]]; then
            ./scripts/run.sh stg --reporter=list,html -g "$GREP"
          else
            ./scripts/run.sh stg --reporter=list,html
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stg
          path: |
            e2e/playwright-next-article-share-app/playwright-report/
            e2e/playwright-next-article-share-app/test-results/
          retention-days: 14
